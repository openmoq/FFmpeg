<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Fontconfig's configuration for ffmpeg.exe on Windows, which reads it from
     fonts\fonts.conf next to it: the Windows fonts, and the generic names
     drawtext uses without fontfile= (font=Sans by default). -->
<fontconfig>
  <dir>WINDOWSFONTDIR</dir>
  <dir>WINDOWSUSERFONTDIR</dir>
  <cachedir>LOCAL_APPDATA_FONTCONFIG_CACHE</cachedir>
  <alias binding="same"><family>sans</family><prefer><family>Arial</family></prefer></alias>
  <alias binding="same"><family>sans-serif</family><prefer><family>Arial</family></prefer></alias>
  <alias binding="same"><family>serif</family><prefer><family>Times New Roman</family></prefer></alias>
  <alias binding="same"><family>mono</family><prefer><family>Consolas</family></prefer></alias>
  <alias binding="same"><family>monospace</family><prefer><family>Consolas</family></prefer></alias>
</fontconfig>
